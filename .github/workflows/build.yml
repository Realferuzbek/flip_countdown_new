
name: Build Installers

on:
  push:
    branches: [main]
  release:
    types: [created]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: npm run build:win
            artifact-name: flip-countdown-dist-windows
          - os: macos-latest
            build-script: npm run build:mac
            artifact-name: flip-countdown-dist-macos
          - os: ubuntu-latest
            build-script: npm run build:linux
            artifact-name: flip-countdown-dist-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: ${{ matrix.build-script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/**
          if-no-files-found: error

# Note: Notarization / code signing steps can be added with secrets (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, etc.) when needed.
