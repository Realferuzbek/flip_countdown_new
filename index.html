<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flip Countdown</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="alternate icon" href="./assets/icon.png" />
  <link rel="stylesheet" href="./styles.css?v=20241029d" />
</head>
<body>
  <div id="app" class="app">
    <div class="bg"></div>

    <div class="content">
      <div class="mode-toggle" role="group" aria-label="Timer modes">
        <button class="mode-btn is-active" type="button" data-mode="pomodoro">pomodoro</button>
        <button class="mode-btn" type="button" data-mode="short">short break</button>
        <button class="mode-btn" type="button" data-mode="long">long break</button>
      </div>

      <div class="time-wrap" id="timeWrap" title="Click to set time (MM:SS). Press Enter to apply.">
        <div class="flip mm-tens" data-digit="0"></div>
        <div class="flip mm-ones" data-digit="0"></div>
        <div class="colon">:</div>
        <div class="flip ss-tens" data-digit="0"></div>
        <div class="flip ss-ones" data-digit="0"></div>
      </div>

      <input id="timeInput" class="time-input" maxlength="5" placeholder="MM:SS" aria-label="Set time MM:SS" />

      <div class="hint" aria-hidden="true"></div>

      <div class="controls" role="group" aria-label="Timer controls">
        <button id="startBtn" class="control-btn control-btn--primary" type="button">start</button>
        <button id="resetBtn" class="control-btn control-btn--icon" type="button" aria-label="Restart timer" title="Restart timer">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-refresh">
              <!-- Arc is stroked; arrowhead is a small filled triangle for the crisp “reference” look -->
              <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <!-- 300° clockwise arc ending near 1–2 o’clock -->
                <path d="M20 12a8 8 0 1 1-2.4-5.7"/>
              </g>
              <!-- solid arrowhead pointing clockwise at the arc end -->
              <path d="M21 6.6l-3.2-3.2v6.4z" fill="currentColor"/>
            </svg>
          </button>
        <button id="fab-bg" class="control-btn control-btn--icon" type="button" aria-label="Backgrounds" title="Backgrounds" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3.2"/>
              <path d="M19.4 12a7.4 7.4 0 0 0-.1-1l1.9-1.5-1.2-2.1-2.3.6c-.5-.4-1.1-.8-1.7-1l-.3-2.3h-2.4l-.3 2.3c-.6.2-1.2.6-1.7 1l-2.3-.6-1.2 2.1 1.9 1.5a7.4 7.4 0 0 0 0 2l-1.9 1.5 1.2 2.1 2.3-.6c.5.4 1.1.8 1.7 1l.3 2.3h2.4l.3-2.3c.6-.2 1.2-.6 1.7-1l2.3.6 1.2-2.1-1.9-1.5c.1-.3.1-.7.1-1z"/>
            </g>
          </svg>
        </button>
      </div>
    </div>

    <!-- audio src set from JS -->
    <audio id="alarm" preload="auto"></audio>
  </div>

  <!-- Floating action: Fullscreen -->
  <div class="fab-wrap" aria-live="polite">
    <button id="fab-fs" class="fab" type="button" aria-label="Fullscreen" title="Fullscreen" hidden>
      <!-- radiant fullscreen icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 5.5H5.5V8" />
          <path d="M16 5.5h2.5V8" />
          <path d="M5.5 16v2.5H8" />
          <path d="M18.5 16v2.5H16" />
        </g>
      </svg>
    </button>
  </div>

  <!-- Background picker sheet -->
  <div id="bg-sheet" class="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <h2 id="sheet-title" class="visually-hidden">Settings</h2>
      <input type="radio" name="sheet-tab" id="sheet-tab-timers" class="sheet__tab-input" />
      <input type="radio" name="sheet-tab" id="sheet-tab-background" class="sheet__tab-input" checked />
      <button class="sheet__close icon-btn" type="button" data-close aria-label="Close">✕</button>
      <div class="sheet__layout">
        <nav class="sheet__sidebar" aria-label="Settings sections">
          <label for="sheet-tab-timers" class="sheet__tab" id="sheet-tab-timers-label">
            <span>Pomodoro</span>
          </label>
          <label for="sheet-tab-background" class="sheet__tab" id="sheet-tab-background-label">
            <span>Background</span>
          </label>
        </nav>
        <div class="sheet__content">
          <section class="sheet__pane sheet__pane--timers" role="region" aria-labelledby="sheet-tab-timers-label">
            <header class="sheet__section-header">
              <div>
                <h3>Pomodoro</h3>
                <p>Dial in focus and breaks for your perfect flow.</p>
              </div>
            </header>
            <div class="pomodoro-grid" role="group" aria-label="Timer durations">
              <div class="pomodoro-field">
                <label class="pomodoro-label" for="pomodoro-focus">Pomodoro</label>
                <div class="pomodoro-input">
                  <input id="pomodoro-focus" type="number" inputmode="numeric" min="1" max="99" value="25" aria-describedby="pomodoro-focus-meta" />
                </div>
                <span id="pomodoro-focus-meta" class="pomodoro-meta">minutes</span>
              </div>
              <div class="pomodoro-field">
                <label class="pomodoro-label" for="pomodoro-short">Short Break</label>
                <div class="pomodoro-input">
                  <input id="pomodoro-short" type="number" inputmode="numeric" min="1" max="99" value="5" aria-describedby="pomodoro-short-meta" />
                </div>
                <span id="pomodoro-short-meta" class="pomodoro-meta">minutes</span>
              </div>
              <div class="pomodoro-field">
                <label class="pomodoro-label" for="pomodoro-long">Long Break</label>
                <div class="pomodoro-input">
                  <input id="pomodoro-long" type="number" inputmode="numeric" min="1" max="99" value="15" aria-describedby="pomodoro-long-meta" />
                </div>
                <span id="pomodoro-long-meta" class="pomodoro-meta">minutes</span>
              </div>
            </div>
            <footer class="pomodoro-actions">
              <button type="button" class="pomodoro-btn pomodoro-btn--outline">Reset all</button>
              <div class="pomodoro-actions__spacer" aria-hidden="true"></div>
              <button type="button" class="pomodoro-btn pomodoro-btn--muted">Close</button>
              <button type="button" class="pomodoro-btn pomodoro-btn--primary">Save changes</button>
            </footer>
          </section>
          <section class="sheet__pane sheet__pane--background" role="region" aria-labelledby="sheet-tab-background-label">
            <header class="sheet__header">
              <h3 id="bg-title">Choose background</h3>
            </header>
            <div id="bg-grid" class="sheet__grid" role="list"></div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- Load as module so we can resolve assets robustly -->
  <script type="module" src="./script.js?v=20241029e"></script>
</body>
</html>
