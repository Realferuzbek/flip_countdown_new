<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flip Countdown</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app">
    <div class="bg"></div>

    <div class="content">
      <div class="time-wrap" id="timeWrap" title="Click to set time (MM:SS). Press Enter to apply.">
        <div class="flip mm-tens" data-digit="0"></div>
        <div class="flip mm-ones" data-digit="0"></div>
        <div class="colon">:</div>
        <div class="flip ss-tens" data-digit="0"></div>
        <div class="flip ss-ones" data-digit="0"></div>
      </div>

      <input id="timeInput" class="time-input" maxlength="5" placeholder="MM:SS" aria-label="Set time MM:SS" />

      <div id="note" class="note" contenteditable="false" spellcheck="false"
           title="Click to write a note. Press Enter to save."></div>

      <div class="hint" aria-hidden="true"></div>
    </div>

    <!-- audio src set from JS -->
    <audio id="alarm" preload="auto"></audio>
  </div>

  <button
    id="btn-settings"
    class="fab fab--settings"
    type="button"
    aria-label="Background settings"
    aria-pressed="false"
    hidden
  >
    <svg class="fab__icon" viewBox="0 0 24 24" role="presentation" focusable="false" aria-hidden="true">
      <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l1.72-1.34a.5.5 0 0 0 .12-.64l-1.63-2.82a.5.5 0 0 0-.61-.22l-2.03.82a6.93 6.93 0 0 0-1.63-.94l-.31-2.17A.5.5 0 0 0 14.26 4h-4.52a.5.5 0 0 0-.5.43l-.31 2.17c-.59.23-1.14.54-1.63.94l-2.03-.82a.5.5 0 0 0-.61.22L2.03 9.76a.5.5 0 0 0 .12.64l1.72 1.34c-.04.31-.06.63-.06.94s.02.63.06.94l-1.72 1.34a.5.5 0 0 0-.12.64l1.63 2.82a.5.5 0 0 0 .61.22l2.03-.82c.49.39 1.04.71 1.63.94l.31 2.17a.5.5 0 0 0 .5.43h4.52a.5.5 0 0 0 .5-.43l.31-2.17c.59-.23 1.14-.54 1.63-.94l2.03.82a.5.5 0 0 0 .61-.22l1.63-2.82a.5.5 0 0 0-.12-.64l-1.72-1.34Zm-7.14 1.56a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5Z" />
    </svg>
  </button>

  <button
    id="btn-fullscreen"
    class="fab fab--fullscreen"
    type="button"
    aria-label="Enter fullscreen"
    aria-pressed="false"
    hidden
  >
    <svg class="fab__icon" viewBox="0 0 24 24" role="presentation" focusable="false" aria-hidden="true">
      <path fill="currentColor" d="M7 4H5v2H3V3h4v1zm10-1h4v3h-2V5h-2V3zM7 20H3v-3h2v1h2v2zm14-3v3h-4v-2h2v-1h2z" />
    </svg>
  </button>

  <div
    id="bg-picker"
    class="sheet"
    role="dialog"
    aria-modal="true"
    aria-labelledby="bg-picker-title"
    hidden
  >
    <button class="sheet__backdrop" type="button" data-sheet-dismiss aria-label="Close background picker"></button>
    <div class="sheet__panel" role="document">
      <header class="sheet__header">
        <h2 id="bg-picker-title" class="sheet__title">Choose background</h2>
        <button class="sheet__close" type="button" data-sheet-dismiss aria-label="Close background picker">
          <svg viewBox="0 0 24 24" role="presentation" focusable="false" aria-hidden="true">
            <path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.42 1.42L10.59 13.4l-6.3 6.3-1.42-1.42L9.17 12 2.88 5.71 4.3 4.29l6.29 6.3 6.29-6.3z" />
          </svg>
        </button>
      </header>
      <div id="bg-grid" class="bg-grid" role="list"></div>
    </div>
  </div>

  <!-- Load as module so we can resolve assets robustly -->
  <script type="module" src="./script.js"></script>

  <!-- Floating actions: Backgrounds & Fullscreen -->
  <div class="fab-wrap" aria-live="polite">
    <button id="fab-bg" class="fab" type="button" aria-label="Backgrounds" title="Backgrounds" hidden>
      <!-- gear icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm9-3.5 1.9 1.1a.8.8 0 0 1 .3 1.1l-1.8 3.1a.8.8 0 0 1-1.1.3l-2-.8c-.4.3-.8.5-1.3.7l-.3 2.1a.8.8 0 0 1-.8.7h-3.6a.8.8 0 0 1-.8-.7l-.3-2.1c-.5-.1-.9-.4-1.3-.7l-2 .8a.8.8 0 0 1-1.1-.3L.8 14.2a.8.8 0 0 1 .3-1.1L3 12l-1.9-1.1a.8.8 0 0 1-.3-1.1l1.8-3.1a.8.8 0 0 1 1.1-.3l2 .8c.4-.3.8-.5 1.3-.7l.3-2.1A.8.8 0 0 1 8.1 3h3.6a.8.8 0 0 1 .8.7l.3 2.1c.5.1.9.4 1.3.7l2-.8a.8.8 0 0 1 1.1.3l1.8 3.1a.8.8 0 0 1-.3 1.1L21 12Z"/></svg>
    </button>
    <button id="fab-fs" class="fab" type="button" aria-label="Fullscreen" title="Fullscreen" hidden>
      <!-- fullscreen icon -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4H2V2h6v2Zm14 0h-4V2h6v6h-2V4ZM4 16h4v2H2v-6h2v4Zm18-4h2v6h-6v-2h4v-4Z"/></svg>
    </button>
  </div>

  <!-- Background picker sheet -->
  <div id="bg-sheet" class="sheet" hidden>
    <div class="sheet__backdrop" data-close></div>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="bg-title" tabindex="-1">
      <header class="sheet__header">
        <h3 id="bg-title">Choose background</h3>
        <button class="icon-btn" type="button" data-close aria-label="Close">✕</button>
      </header>
      <div id="bg-grid" class="sheet__grid" role="list"></div>
    </div>
  </div>
</body>
</html>
